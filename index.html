<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Ứng Dụng Miễn Phí</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fcfaf7; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #ff6622; text-transform: uppercase; margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 14px; margin-top: 0; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto; }
        .card { background: white; border: 1px solid #eee; border-radius: 8px; padding: 15px; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 15px 0; font-size: 18px; color: #333; }
        .btn-download { display: block; background-color: #ff6622; color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-download:hover { background-color: #e65518; }
        hr { border: 0; border-top: 2px solid #ff6622; width: 80%; margin: 20px auto; }
    </style>
</head>
<body>

    <h1>TỔNG HỢP ỨNG DỤNG MIỄN PHÍ HOÀNG ANH</h1>

        <!-- Ứng dụng 3 -->

</html>
